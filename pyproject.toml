[project]
requires-python = ">= 3.14"
name = "renamarr"
description = "continual rename tool for *arr apps"
authors = [{ name = "Brad Holland", email = "hollanbm@gmail.com" }]
version = "1"
dependencies = [
  "pycliarr>=1.0.26,<2",
  "python-dotenv>=1.0.1,<2",
  "loguru>=0.7.3,<0.8",
  "python-dateutil>=2.9.0.post0,<3",
  "python-config-parser>=3.1.3,<4",
  "schedule>=1.2.2,<2",
]

[dependency-groups]
dev = [
  "ruff==0.16.0",
  "ty==0.0.65",
]
test = [
  "pytest>=9.0.1,<10",
  "pytest-cov>=7.0.0,<8",
  "pytest-mock>=3.14.0,<4",
  "mock>=5.1.0,<6",
  "pytest-loguru>=0.4.0,<0.5",
]

# Treat this repo as an application, so uv installs dependencies without packaging renamarr itself.
[tool.uv]
required-version = "==0.12.0"
package = false
exclude-dependencies = ["m2r2"]
environments = [
  "sys_platform == 'darwin'",
  "sys_platform == 'linux'",
]

[tool.ruff]
target-version = "py314"
extend-exclude = [
  "src/renamarr/sonarr/services/series_scanner.py",
  "tests/test_sonarr_series_scanner.py",
]
force-exclude = true

[tool.ruff.lint]
extend-select = [
  "B",
  "BLE",
  "DTZ",
  "G",
  "I",
  "LOG",
  "PERF",
  "PIE",
  "PT",
  "RET",
  "RSE",
  "RUF",
  "SIM",
  "T10",
  "UP",
]

[tool.ruff.lint.isort]
known-first-party = [
  "config_schema",
  "healthcheck",
  "interval",
  "main",
  "renamarr",
  "tests",
]

[tool.ty.src]
include = ["src"]

[tool.ty.analysis]
# These dependencies expose incomplete or overly broad type information.
replace-imports-with-any = [
  "pycliarr.**",
  "schema.**",
]

[tool.pytest]
pythonpath = ["./src"]
testpaths = ["./tests", "./tests/models"]
addopts = [
  "--cov=src",
  "--cov-branch",
  "--cov-fail-under=100",
  "--capture=sys",
  "--cov-report=xml:coverage.xml",
  "--cov-report=html",
  "--import-mode=importlib",
]
filterwarnings = [
  "error",
]
mock_use_standalone_module = "True"
