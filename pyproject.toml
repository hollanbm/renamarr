[project]
requires-python = ">= 3.14"
name = "renamarr"
description = "continual rename tool for *arr apps"
authors = [{ name = "Brad Holland", email = "hollanbm@gmail.com" }]
version = "1"
dependencies = [
  "python-dotenv>=1.0.1,<2",
  "python-config-parser>=3.1.3,<4",
  "schedule>=1.2.2,<2",
  "sonarr",
  "pydantic>=2,<3",
  "radarr>=1.2.1",
  "structlog>=26.1.0,<27",
  "opentelemetry-api>=1.44.0,<2",
  "opentelemetry-sdk>=1.44.0,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0,<2",
  "opentelemetry-instrumentation-logging>=0.65b0,<0.66",
  "opentelemetry-distro>=0.65b0,<0.66",
  "opentelemetry-exporter-otlp>=1.44.0,<2",
]

[dependency-groups]
dev = [
  "ruff==0.16.6",
  "ty==0.0.79",
]
test = [
  "pytest>=9.0.1,<10",
  "pytest-cov>=7.0.0,<8",
  "pytest-mock>=3.14.0,<4",
]

# Treat this repo as an application, so uv installs dependencies without packaging renamarr itself.
[tool.uv]
required-version = "==0.12.10"
package = false
exclude-dependencies = ["m2r2"]
environments = [
  "sys_platform == 'darwin'",
  "sys_platform == 'linux'",
]

[tool.uv.sources]
sonarr = { git = "https://github.com/devopsarr/sonarr-py.git", tag = "v1.1.1" }
radarr = { git = "https://github.com/devopsarr/radarr-py.git", tag = "v1.2.1" }

[tool.ty.analysis]
# These dependencies expose incomplete or overly broad type information.
replace-imports-with-any = ["schema.**"]

[tool.pytest]
pythonpath = ["./src"]
testpaths = ["./tests", "./tests/models"]
addopts = [
  "--cov=src",
  "--cov-branch",
  "--cov-fail-under=100",
  "--capture=sys",
  "--cov-report=xml:coverage.xml",
  "--cov-report=html",
  "--import-mode=importlib",
]
filterwarnings = [
  "error",
]
