name: Cleanup Docker images

on:
  schedule:
    - cron: 30 6 * * 0
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log cleanup candidates without deleting images
        required: true
        default: true
        type: boolean
      include_legacy_tags:
        description: Include the verified one-time legacy tag list
        required: true
        default: false
        type: boolean

concurrency:
  group: ghcr-renamarr-registry
  queue: max

jobs:
  prune-registry:
    name: Prune registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - name: Build cleanup selectors
        id: cleanup-selectors
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          INCLUDE_LEGACY_TAGS: ${{ github.event_name == 'workflow_dispatch' && inputs.include_legacy_tags }}
        with:
          script: |
            // Confirm GitHub exposes complete registry pagination before allowing cleanup.
            const {data: packageVersions, headers: packageHeaders} = await github.request(
              "GET /users/{username}/packages/{package_type}/{package_name}/versions",
              {
                username: context.repo.owner,
                package_type: "container",
                package_name: "renamarr",
                per_page: 100,
              },
            )
            // A multi-page response must identify its final page so no versions are missed.
            const packageLinkHeader = packageHeaders.link ?? ""
            const hasNextPage = packageLinkHeader.includes('rel="next"')
            const hasLastPage = packageLinkHeader.includes('rel="last"')
            if ((packageVersions.length === 100 || hasNextPage) && !hasLastPage) {
              core.setFailed(
                "GitHub omitted the last-page link required for safe cleanup.",
              )
              return
            }

            // Preserve every image associated with a pull request that is still open.
            const openPullRequests = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            })
            // Use every Git tag, not a version pattern, as the source of protected releases.
            const repositoryTags = await github.paginate(github.rest.repos.listTags, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })
            // Protect release and development variants, plus exact and SHA-suffixed PR tags.
            // A Set removes any duplicate selectors produced by overlapping tag names.
            const excludeSelectors = new Set([
              ...repositoryTags.flatMap(({name}) => [name, `${name}-dev`]),
              ...openPullRequests.flatMap(({number}) => [
                `pr-${number}`,
                `pr-${number}-*`,
              ]),
            ])
            // All PR images are candidates; the exclusions above retain images for open PRs.
            const deleteSelectors = ["pr-*"]
            if (process.env.INCLUDE_LEGACY_TAGS === "true") {
              // These verified obsolete tags are opt-in to keep scheduled cleanup conservative.
              deleteSelectors.push(
                "199-4b3ea20",
                "bug-139-redundant-error",
                "bug-fix-python-ci",
                "feat-173-python-314",
                "feat-83-folder-renaming",
                "feat-better_config_error_messages",
                "feat-fix-66-multistage-build",
                "feat-fix-72-upgrade-python",
                "feat-poetry2.x",
                "feat-radarr_support",
              )
            }

            // The cleanup action accepts selectors as comma-delimited output strings.
            core.info(
              `Generated ${deleteSelectors.length} delete selectors and ` +
                `${excludeSelectors.size} exclusions.`,
            )
            core.setOutput("delete_tags", deleteSelectors.join(","))
            core.setOutput("exclude_tags", [...excludeSelectors].join(","))
      - name: Cleanup images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f  # v1.2.2
        with:
          owner: hollanbm
          package: renamarr
          delete-tags: ${{ steps.cleanup-selectors.outputs.delete_tags }}
          exclude-tags: ${{ steps.cleanup-selectors.outputs.exclude_tags }}
          delete-untagged: true
          delete-ghost-images: false
          delete-partial-images: false
          delete-orphaned-images: false
          older-than: 1 day
          dry-run: ${{ vars.GHCR_CLEANUP_LIVE != 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
          validate: true
