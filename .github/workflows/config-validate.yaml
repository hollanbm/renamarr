name: Config validators

permissions:
  contents: read
  pull-requests: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: changes
        with:
          filters: |
            codecov:
              - 'codecov.yml'
              - '.github/workflows/config-validate.yaml'
            renovate:
              - 'renovate.json'
              - '.github/workflows/config-validate.yaml'

      - name: Validate Codecov config
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.codecov == 'true'
        run: curl --fail-with-body --silent --show-error --request POST --data-binary @codecov.yml https://api.codecov.io/validate

      - name: Validate Renovate config
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renovate == 'true'
        uses: suzuki-shunsuke/github-action-renovate-config-validator@ee9f69e1f683ed0d08225086482b34fc9abe9300  # v2.1.0
        with:
          config_file_path: renovate.json
          strict: 'true'
