name: Repository checks

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      hadolint: ${{ steps.filter.outputs.hadolint }}
      actionlint: ${{ steps.filter.outputs.actionlint }}
      codecov: ${{ steps.filter.outputs.codecov }}
      renovate: ${{ steps.filter.outputs.renovate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        if: github.event_name == 'push'
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            hadolint:
              - 'Dockerfile'
              - '.hadolint.yaml'
              - '.github/workflows/repo-checks.yaml'
              - 'mise.toml'
            actionlint:
              - '.github/workflows/*.yaml'
              - '.github/actionlint.yaml'
              - 'mise.toml'
            codecov:
              - 'codecov.yml'
              - '.github/workflows/repo-checks.yaml'
            renovate:
              - 'renovate.json'
              - '.github/workflows/repo-checks.yaml'

  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518  # v4.2.5
        with:
          version: 2026.8.6
          install_args: python prek

      - name: Run formatting checks
        run: |-
          prek run --all-files \
          yamlfix \
          mdformat \
          trailing-whitespace \
          end-of-file-fixer

  hadolint:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.hadolint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518  # v4.2.5
        with:
          version: 2026.8.6
          install_args: python hadolint

      - name: Run hadolint
        run: hadolint --config .hadolint.yaml Dockerfile

  actionlint:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.actionlint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518  # v4.2.5
        with:
          version: 2026.8.6
          install_args: python actionlint

      - name: Run actionlint
        run: actionlint

  codecov:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.codecov == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Validate Codecov config
        run: curl --fail-with-body --silent --show-error --request POST --data-binary @codecov.yml https://api.codecov.io/validate

  renovate:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.renovate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Validate Renovate config
        uses: suzuki-shunsuke/github-action-renovate-config-validator@ee9f69e1f683ed0d08225086482b34fc9abe9300  # v2.1.0
        with:
          config_file_path: renovate.json
          strict: 'true'
